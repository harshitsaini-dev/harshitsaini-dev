name: Generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: harshitsaini-dev
          outputs: snake.svg

      - name: Commit if the animation changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- snake.svg; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git add snake.svg
          git commit -m "chore: refresh snake animation"
          git push
