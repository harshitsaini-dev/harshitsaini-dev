name: Update profile card stats

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch live stats and regenerate cards
        env:
          GH_PAT: ${{ secrets.PROFILE_PAT }}
        run: node scripts/update-card.mjs

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "No stat changes, nothing to commit."
            exit 0
          fi
          # bust GitHub's image cache so the profile page picks up the new svg
          sed -i "s/\(dark_mode\.svg?v=\|light_mode\.svg?v=\)[0-9]*/\1$(date +%s)/g" README.md
          git add dark_mode.svg light_mode.svg README.md
          git commit -m "chore: refresh profile card stats"
          git fetch origin main
          git rebase origin/main
          git push
